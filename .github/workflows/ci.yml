name: JalOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ================================================================
  # Backend CI
  # ================================================================
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt

      - name: Run business logic checks
        run: |
          python -m unittest discover -s backend/app -v

      - name: Verify a fresh SQLite database migrates
        env:
          DATABASE_URL: sqlite+pysqlite:///./jalos-ci.sqlite3
        run: |
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Verify an unversioned legacy SQLite database upgrades
        run: |
          python scripts/smoke_legacy_migration.py

      - name: Import FastAPI and validate route models
        env:
          JWT_SECRET: ci-only-validation-secret-not-for-deployment
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'backend')
          from app.main import app, MaintenanceInput
          print(f'{len(app.routes)} FastAPI routes loaded')
          "

      - name: Run local end-to-end API smoke flow
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/jalos-e2e.sqlite3
          JWT_SECRET: ci-only-validation-secret-not-for-deployment
          DEMO_ADMIN_EMAIL: admin@jalos.local
          DEMO_ADMIN_PASSWORD: AdminDemo-2026!Change
          DEMO_RESIDENT_EMAIL: resident@jalos.local
          DEMO_RESIDENT_PASSWORD: ResidentDemo-2026!Change
          JALOS_SIM_TICK_SECONDS: '0.5'
        run: |
          python -m uvicorn \
            app.main:app \
            --app-dir backend \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/jalos-api.log 2>&1 &

          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:8000/api/v1/health/components \
              > /dev/null; then
              break
            fi
            sleep 1
          done

          python scripts/smoke_local.py \
            --base-url http://127.0.0.1:8000

      - name: Parse backend source
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(Path("backend/app").rglob("*.py"))

          if not files:
              raise SystemExit(
                  "No Python source files found under backend/app"
              )

          for path in files:
              source = path.read_text(encoding="utf-8-sig")
              ast.parse(source, filename=str(path))
              print(f"Parsed: {path}")

          print(f"Successfully parsed {len(files)} Python files.")
          PY

      - name: Build backend image
        run: |
          docker build -f backend/Dockerfile -t jalos-backend .

  # ================================================================
  # Admin Web CI
  # ================================================================
  admin-web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build admin web
        run: npm run build

  # ================================================================
  # Flutter CI
  # ================================================================
  flutter:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

  # ================================================================
  # Terraform CI
  # ================================================================
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  # ================================================================
  # AWS Deployment
  # ================================================================
  deploy:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.JALOS_S3_BUCKET != '' &&
      vars.JALOS_INSTANCE_ID != '' &&
      vars.JALOS_HEALTH_URL != ''

    needs:
      - backend
      - admin-web
      - flutter
      - terraform

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      JALOS_ENVIRONMENT: ${{ vars.JALOS_ENVIRONMENT || 'hackathon' }}
      JALOS_S3_BUCKET: ${{ vars.JALOS_S3_BUCKET }}
      JALOS_INSTANCE_ID: ${{ vars.JALOS_INSTANCE_ID }}
      JALOS_HEALTH_URL: ${{ vars.JALOS_HEALTH_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Build deployment images
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "jalos-backend:${GITHUB_SHA}" \
            .

          docker build \
            -f admin-web/Dockerfile \
            -t "jalos-admin-web:${GITHUB_SHA}" \
            admin-web

      - name: Package deployment images
        run: |
          docker save "jalos-backend:${GITHUB_SHA}" \
            | gzip -1 > /tmp/jalos-backend.tar.gz

          docker save "jalos-admin-web:${GITHUB_SHA}" \
            | gzip -1 > /tmp/jalos-admin-web.tar.gz

      - name: Verify deployment artifacts
        run: |
          test -f docker-compose.production.yml
          test -f ml/artifacts/water-demand-ridge-v1.json

          ls -lh docker-compose.production.yml
          ls -lh ml/artifacts/water-demand-ridge-v1.json
          ls -lh /tmp/jalos-backend.tar.gz
          ls -lh /tmp/jalos-admin-web.tar.gz

      - name: Upload release to private S3 bucket
        run: |
          release="deploy/${JALOS_ENVIRONMENT}/${GITHUB_SHA}"

          aws s3 cp \
            /tmp/jalos-backend.tar.gz \
            "s3://${JALOS_S3_BUCKET}/${release}/backend.tar.gz"

          aws s3 cp \
            /tmp/jalos-admin-web.tar.gz \
            "s3://${JALOS_S3_BUCKET}/${release}/admin-web.tar.gz"

          aws s3 cp \
            docker-compose.production.yml \
            "s3://${JALOS_S3_BUCKET}/${release}/docker-compose.production.yml"

          python - <<'PY'
          import json

          path = "ml/artifacts/water-demand-ridge-v1.json"

          with open(path, encoding="utf-8-sig") as f:
              model = json.load(f)

          assert model.get("model_name"), "Missing model_name"
          assert model.get("version"), "Missing model version"

          coefficients = model.get("coefficients", [])
          feature_count = model.get("feature_count")

          assert isinstance(coefficients, list)
          assert feature_count is not None
          assert len(coefficients) == feature_count

          print("Forecast model validation passed.")
          print("Model:", model["model_name"])
          print("Version:", model["version"])
          PY

          model_name=$(python -c '
          import json
          with open("ml/artifacts/water-demand-ridge-v1.json",
                    encoding="utf-8-sig") as f:
              print(json.load(f)["model_name"])
          ')

          model_version=$(python -c '
          import json
          with open("ml/artifacts/water-demand-ridge-v1.json",
                    encoding="utf-8-sig") as f:
              print(json.load(f)["version"])
          ')

          model_key="models/${model_name}/${model_version}/water-demand-ridge-v1.json"

          aws s3 cp \
            ml/artifacts/water-demand-ridge-v1.json \
            "s3://${JALOS_S3_BUCKET}/${model_key}"

          aws s3 cp \
            ml/artifacts/water-demand-ridge-v1.json \
            "s3://${JALOS_S3_BUCKET}/${release}/forecast-model.json"

          echo "Release artifacts uploaded."

      - name: Deploy over Systems Manager
        run: |
          python - "$GITHUB_SHA" <<'PY'
          import json
          import sys

          with open(
              "/tmp/jalos-ssm-parameters.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "commands": [
                          "sudo /usr/local/sbin/jalos-deploy "
                          + sys.argv[1]
                      ]
                  },
                  f
              )
          PY

          command_id=$(aws ssm send-command \
            --instance-ids "$JALOS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/jalos-ssm-parameters.json \
            --comment "JalOS release ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $command_id"

          status=""

          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$JALOS_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${status:-UNKNOWN}"

            case "$status" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed."

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$JALOS_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text || true

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$JALOS_INSTANCE_ID" \
                  --query StandardErrorContent \
                  --output text || true

                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "$status" != "Success" ]; then
            echo "SSM deployment did not complete successfully."
            echo "Last status: ${status:-not received}"
            exit 1
          fi

          echo "SSM deployment completed successfully."

      - name: Verify public health endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            "${JALOS_HEALTH_URL%/}/health"

          echo ""
          echo "JalOS deployment is healthy."